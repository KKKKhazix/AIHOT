name: 功能建议 / Feature request
description: 提出有明确使用场景的功能或改进。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        还在探索的想法可以先到 [想法交流区](https://github.com/KKKKhazix/AIHOT/discussions/categories/ideas) 讨论。
        本仓库不提供完整运营信源名单，也不持续维护微博、小红书等平台的专用采集适配；可参考 [信源文档](https://github.com/KKKKhazix/AIHOT/blob/main/docs/sources.md) 接入外部采集结果。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与遇到的问题
      description: 谁在什么情况下需要它？目前哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进
      description: 描述你希望看到的行为或结果，也可以附具体例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的办法（可选）
      description: 现有配置、脚本或其他方案为什么不能满足需求？
